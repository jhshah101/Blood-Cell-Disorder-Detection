[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wbc-vit-eca-cf"
version = "1.0.0"
description = "Hybrid ViT-ECA-CF with Adaptive Loss Reweighting for imbalanced white blood cell classification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Academic and research use" }
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["wbc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
